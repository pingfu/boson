name: release

on:
  push:
    branches: [main]

env:
  VERSION: 0.1.${{ github.run_number }}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test Boson.sln -c Release

  build:
    needs: test
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,  rid: linux-x64,   artifact: boson-linux-x64 }
          - { os: ubuntu-latest,  rid: linux-arm64, artifact: boson-linux-arm64 }
          - { os: macos-latest,   rid: osx-arm64,   artifact: boson-osx-arm64 }
          - { os: windows-latest, rid: win-x64,     artifact: boson-win-x64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: >
          dotnet publish src/Boson/Boson.csproj
          -c Release -r ${{ matrix.rid }}
          --self-contained true
          /p:PublishSingleFile=true
          /p:DebugType=embedded
          /p:Version=${{ env.VERSION }}
          -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: publish/boson*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: '**/boson*'
          generate_release_notes: true
