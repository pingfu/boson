name: release

on:
  push:
    branches: [main]

env:
  VERSION: 0.1.${{ github.run_number }}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test Boson.sln -c Release

  build:
    needs: test
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,  rid: linux-x64,   asset: boson-linux-x64 }
          - { os: ubuntu-latest,  rid: linux-arm64, asset: boson-linux-arm64 }
          - { os: macos-latest,   rid: osx-arm64,   asset: boson-osx-arm64 }
          - { os: windows-latest, rid: win-x64,     asset: boson-win-x64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: >
          dotnet publish src/Boson/Boson.csproj
          -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=embedded
          -p:Version=${{ env.VERSION }}
          -o publish

      # dotnet always names the output `boson`/`boson.exe`. Renaming per RID is
      # what keeps the four assets from colliding on basename at release time.
      - name: Name the binary for its platform
        shell: bash
        run: |
          set -euo pipefail
          # Only the binary is published, so anything else here — a native .so
          # that failed to bundle, for one — would be silently dropped.
          count=$(find publish -type f | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "expected exactly one published file, found $count:"
            find publish -type f
            exit 1
          fi
          src=publish/boson
          [ -f "$src" ] || src=publish/boson.exe
          mv "$src" "publish/${{ matrix.asset }}"
          ls -l "publish/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: publish/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      # Guards the collision that shipped an arm64 build as the x64 asset.
      - name: Verify each asset is the architecture its name claims
        run: |
          set -euo pipefail
          ls -l assets
          file assets/boson-linux-x64   | grep -q 'ELF 64-bit.*x86-64'
          file assets/boson-linux-arm64 | grep -q 'ELF 64-bit.*aarch64'
          file assets/boson-osx-arm64   | grep -q 'Mach-O.*arm64'
          file assets/boson-win-x64.exe | grep -q 'PE32+'
          echo "all four assets match their names"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: assets/boson-*
          generate_release_notes: true
